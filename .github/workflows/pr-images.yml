name: PR Images
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  checks: read

jobs:
  WaitForChecks:
    if: >-
      (github.event.action == 'labeled' && contains(fromJSON('["build-images","deploy-staging"]'), github.event.label.name)) ||
      (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, 'build-images') || contains(github.event.pull_request.labels.*.name, 'deploy-staging')))
    uses: formancehq/ci/.github/workflows/wait-for-checks.yml@v1

  GoReleaser:
    needs: WaitForChecks
    concurrency:
      group: build-on-label-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: formancehq/ci/.github/workflows/go-build.yml@v1
    with:
      build-condition: always
      nix-extra-flags: '--extra-experimental-features "nix-command" --extra-experimental-features "flakes"'
    secrets:
      NUMARY_GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
      SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
      FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

  Deploy:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'deploy-staging') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'deploy-staging'))
    needs: GoReleaser
    runs-on: namespace-profile-linux-amd64-2vcpu
    timeout-minutes: 5
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: formancehq/ci/actions/deploy-staging@v1
        with:
          component: payments
          tag: ${{ github.event.pull_request.head.sha }}
          auth-token: ${{ secrets.ARGOCD_REGION_AUTH_TOKEN }}
          ts-oauth-client-id: ${{ secrets.TS_OIDC_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          ts-tags: ${{ vars.TS_TAGS }}
          ts-version: ${{ vars.TS_VERSION }}
          ts-args: ${{ vars.TS_ARGS }}
          ts-retry: ${{ vars.TS_RETRY }}
          ts-timeout: ${{ vars.TS_TIMEOUT }}
          ts-ping: ${{ vars.TS_PING }}
