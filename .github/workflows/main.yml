name: Default
on:
  merge_group:
  push:
    branches:
      - main
      - releases/*
      - release/*
  pull_request:
    types: [ assigned, opened, synchronize, reopened, labeled, edited ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  PR:
    if: github.event_name == 'pull_request'
    uses: formancehq/ci/.github/workflows/go-pr.yml@v1
    permissions:
      pull-requests: read
      statuses: write

  Dirty:
    uses: formancehq/ci/.github/workflows/go-dirty.yml@v1
    with:
      nix-extra-flags: '--extra-experimental-features "nix-command" --extra-experimental-features "flakes"'
    secrets:
      SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}

  Tests:
    uses: formancehq/ci/.github/workflows/go-test.yml@v1
    with:
      runner-profile: namespace-profile-linux-amd64-4vcpu
      nix-extra-flags: '--extra-experimental-features "nix-command" --extra-experimental-features "flakes"'
      enable-codecov: true
      coverage-files: ./coverage.txt
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  GoReleaser:
    needs: [Dirty]
    uses: formancehq/ci/.github/workflows/go-build.yml@v1
    with:
      build-condition: main-and-label
      build-label: build-images
      build-extra-label: deploy-staging
      nix-extra-flags: '--extra-experimental-features "nix-command" --extra-experimental-features "flakes"'
    secrets:
      NUMARY_GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
      SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
      FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

  Deploy:
    runs-on: namespace-profile-linux-amd64-2vcpu
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'deploy-staging')
    timeout-minutes: 5
    environment: staging
    permissions:
      contents: read
      id-token: write
    needs:
      - GoReleaser
      - Tests
    steps:
      - uses: formancehq/ci/actions/deploy-staging@v1
        with:
          component: payments
          tag: ${{ github.sha }}
          auth-token: ${{ secrets.ARGOCD_REGION_AUTH_TOKEN }}
          ts-oauth-client-id: ${{ secrets.TS_OIDC_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          ts-tags: ${{ vars.TS_TAGS }}
          ts-version: ${{ vars.TS_VERSION }}
          ts-args: ${{ vars.TS_ARGS }}
          ts-retry: ${{ vars.TS_RETRY }}
          ts-timeout: ${{ vars.TS_TIMEOUT }}
          ts-ping: ${{ vars.TS_PING }}
