name: Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
  packages: write

jobs:
  TagDomainModule:
    runs-on: ubuntu-latest
    steps:
      - name: Create pkg/domain tag
        run: |
          DOMAIN_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v[0-9]*/v0/')
          gh api repos/${{ github.repository }}/git/refs \
            --method POST \
            --field ref="refs/tags/pkg/domain/${DOMAIN_VERSION}" \
            --field sha="${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}

  GoReleaser:
    runs-on: namespace-profile-linux-amd64-4vcpu
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0
          dissociate: true

      - uses: formancehq/ci/actions/setup-release@v1
        with:
          token: ${{ secrets.NUMARY_GITHUB_TOKEN }}
          nix-extra-flags: '--extra-experimental-features "nix-command" --extra-experimental-features "flakes"'

      - name: Download Go modules
        run: nix develop --impure --command go mod download

      - name: Release
        run: nix --extra-experimental-features "nix-command" --extra-experimental-features "flakes" develop --impure --command just release
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Add the OpenAPI file to the release assets
        run: gh release upload "$TAG_NAME" ./openapi.yaml#openapi.yaml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
