            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/V3PaymentInitiation'

    V3PaymentInitiationAdjustmentsCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          description: Paginated cursor wrapping the initiation's adjustments
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/V3PaymentInitiationAdjustment'

    V3PaymentInitiationRelatedPaymentsCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          description: Paginated cursor wrapping the payments produced by the initiation
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/V3Payment'

    V3PaymentInitiation:
      type: object
      description: A payment Formance asked a connector to execute
      required:
        - id
        - connectorID
        - provider
        - reference
        - createdAt
        - scheduledAt
        - description
        - type
        - amount
        - asset
        - status
      properties:
        id:
          type: string
          description: Unique identifier of the payment initiation
        connectorID:
          type: string
          format: byte
          description: Identifier of the connector executing the payment
        provider:
          type: string
          description: Name of the payment provider behind the connector
        reference:
          type: string
          description: Caller-supplied identifier for the initiation
        createdAt:
          type: string
          format: date-time
          description: When the initiation was created
        scheduledAt:
          type: string
          format: date-time
          description: When the payment is scheduled to execute
        description:
          type: string
          description: Human-readable description carried with the payment
        type:
          $ref: '#/components/schemas/V3PaymentInitiationTypeEnum'
        amount:
          type: integer
          format: bigint
          description: Amount to move, in the asset's smallest unit
        asset:
          type: string
          description: Asset the payment is denominated in
        status:
          $ref: '#/components/schemas/V3PaymentInitiationStatusEnum'
        sourceAccountID:
          type: string
          format: byte
          description: Identifier of the account the funds leave
        destinationAccountID:
          type: string
          format: byte
          description: Identifier of the account the funds reach
        error:
          type: string
          nullable: true
          description: Why the initiation failed, absent when it succeeded
        metadata:
          $ref: '#/components/schemas/V3Metadata'

    V3PaymentInitiationAdjustment:
      type: object
      required:
        - id
        - createdAt
        - status
      properties:
        id:
          type: string
          description: Unique identifier of the adjustment
        createdAt:
          type: string
          format: date-time
          description: When the adjustment was recorded
        status:
          $ref: '#/components/schemas/V3PaymentInitiationStatusEnum'
        amount:
          type: integer
          format: bigint
          description: Amount carried by this adjustment
        asset:
          type: string
          description: Asset the adjustment is denominated in
        error:
          type: string
          nullable: true
          description: Why this step failed, absent when it succeeded
        metadata:
          $ref: '#/components/schemas/V3Metadata'

    V3GetPaymentInitiationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V3PaymentInitiation'

    V3PaymentInitiationStatusEnum:
      type: string
      description: Where a payment initiation stands in its lifecycle
      enum:
        - UNKNOWN
        - WAITING_FOR_VALIDATION
        - SCHEDULED_FOR_PROCESSING
        - PROCESSING
        - PROCESSED
        - FAILED
        - REJECTED
        - REVERSE_PROCESSING
        - REVERSE_FAILED
        - REVERSED

    V3PaymentInitiationTypeEnum:
      type: string
      description: Kind of movement a payment initiation performs, such as a transfer or a payout
      enum:
        - UNKNOWN
        - TRANSFER
        - PAYOUT

