              format: int64
              minimum: 1
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            data:
              type: array
              items:
                $ref: '#/components/schemas/V3PaymentServiceUserLinkAttempt'

    V3PaymentServiceUser:
      type: object
      description: An end user on whose behalf payments and open banking connections are made
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
          description: Unique identifier of the payment service user
        name:
          type: string
          description: Full name of the payment service user
        createdAt:
          type: string
          format: date-time
          description: When the user was registered
        contactDetails:
          $ref: '#/components/schemas/V3ContactDetails'
        address:
          $ref: '#/components/schemas/V3Address'
        bankAccountIDs:
          type: array
          items:
            type: string
          nullable: true
          description: Bank accounts associated with the user
        metadata:
          $ref: '#/components/schemas/V3Metadata'

    V3PaymentServiceUserConnection:
      type: object
      required:
        - connectionID
        - connectorID
        - createdAt
        - dataUpdatedAt
        - status
      properties:
        connectionID:
          type: string
          description: Identifier of the open banking connection at the provider
        connectorID:
          type: string
          description: Identifier of the connector holding the connection
        createdAt:
          type: string
          format: date-time
          description: When the connection was established
        dataUpdatedAt:
          type: string
          format: date-time
          description: When data was last refreshed over this connection
        status:
          $ref: '#/components/schemas/V3ConnectionStatusEnum'
        error:
          type: string
          nullable: true
          description: Why the connection is failing, absent while it is healthy
        metadata:
          $ref: '#/components/schemas/V3Metadata'

    V3PaymentServiceUserLinkAttempt:
      type: object
      required:
        - id
        - psuID
        - connectorID
        - createdAt
        - status
        - clientRedirectURL
      properties:
        id:
          type: string
          description: Unique identifier of the link attempt
        psuID:
          type: string
          description: Identifier of the payment service user the attempt belongs to
        connectorID:
          type: string
          description: Identifier of the connector the user is linking to
        createdAt:
          type: string
          format: date-time
          description: When the attempt was started
        status:
          $ref: '#/components/schemas/V3OpenBankingConnectionAttemptStatusEnum'
        clientRedirectURL:
          type: string
          format: url
          description: URL the user is sent back to once the provider's flow finishes
        error:
          type: string
          nullable: true
          description: Why the attempt failed, absent when it succeeded

    V3ContactDetails:
      type: object
      description: How to reach a payment service user
      properties:
        email:
          type: string
          description: Email address of the user
        phoneNumber:
          type: string
          description: Phone number of the user, in international format

    V3Address:
      type: object
      description: A postal address
      properties: 
        streetNumber:
          type: string
          description: Street number of the address
        streetName:
          type: string
          description: Street name of the address
        city:
          type: string
          description: City of the address
        region:
          type: string
          description: Region, state or province of the address
        postalCode:
          type: string
          description: Postal or ZIP code of the address
        country:
          type: string
          description: Country of the address, as an ISO 3166-1 alpha-2 code

    V3GetPaymentServiceUserResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V3PaymentServiceUser'

    V3ForwardPaymentServiceUserBankAccountRequest:
      type: object
      required:
        - connectorID
      properties:
        connectorID:
          type: string
          format: byte
          description: Identifier of the connector to forward the bank account to

    V3ForwardPaymentServiceUserBankAccountResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: The task tracking the forwarding, which completes asynchronously
          required:
            - taskID
          properties:
            taskID:
              description: >
                Since this call is asynchronous, the response will contain the ID of the task that was created to forward the bank account to the PSP. You can use the task API to check the status of
                the task and get the resulting bank account ID.
              type: string

    V3ConnectionStatusEnum:
      type: string
      description: Whether an open banking connection is still usable or needs the user to reconnect
      enum:
        - ACTIVE
        - ERROR

    V3OpenBankingConnectionAttemptStatusEnum:
      type: string
      description: Where a link attempt stands, from pending through to completed or failed
      enum:
        - pending
        - completed
        - exited

    V3PaymentServiceUserCreateLinkRequest:
      type: object
      required:
        - clientRedirectURL
      properties:
        applicationName:
          type: string
          description: The name of the application to be displayed to the user when they click the link (depending on the open banking provider). Note that this field might be mandatory for some open banking providers.
        clientRedirectURL:
          type: string
          format: url
          description: The URL to redirect the user to after the link flow is completed.

    V3PaymentServiceUserCreateLinkResponse:
      type: object
      required:
        - attemptID
        - link
      properties:
        attemptID:
          type: string
          description: Identifier of the link attempt this URL belongs to
        link:
          type: string
          format: url
          description: URL to send the user to so they can authorise the connection

    V3PaymentServiceUserUpdateLinkRequest:
      type: object
      required:
        - clientRedirectURL
      properties:
        applicationName:
          type: string
          description: The name of the application to be displayed to the user when they click the link (depending on the open banking provider). Note that this field might be mandatory for some open banking providers.
        clientRedirectURL:
          type: string
          format: url
          description: URL to send the user back to once the provider's flow finishes

    V3PaymentServiceUserUpdateLinkResponse:
      type: object
      required:
        - attemptID
        - link
      properties:
        attemptID:
          type: string
          description: Identifier of the link attempt this URL belongs to
        link:
          type: string
          format: url
          description: URL to send the user to so they can renew the connection

    # POOLS
    V3CreatePoolRequest:
      type: object
      description: Query and dynamic pools are available from Connectivity v3.1
      required:
        - name
      properties:
        name:
          type: string
          description: Human-readable name for the pool
        query:
          description: The same query than in ListAccount. Allowed properties are id, reference, connector_id, type, default_asset, name, psu_id, open_banking_connection_id and metadata.
          type: object
          additionalProperties: true
        accountIDs:
          type: array
          description: Accounts to place in the pool. Omit when the pool is driven by a query
          items:
            type: string

    V3CreatePoolResponse:
      type: object
      required:
        - data
      properties:
        data:
          description: The ID of the created pool
          type: string

    V3UpdatePoolQueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: object
          description: Filter selecting the accounts a dynamic pool contains
          additionalProperties: true

    V3PoolsCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          description: Paginated cursor wrapping the list of pools
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/V3Pool'

    V3GetPoolResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V3Pool'

    V3PoolBalancesResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V3PoolBalances'

    V3Pool:
      type: object
      description: A named group of accounts whose balances are aggregated together
      required:
        - id
        - name
        - createdAt
        - poolAccounts
      properties:
        id:
          type: string
          description: Unique identifier of the pool
        name:
          type: string
          description: Human-readable name of the pool
        createdAt:
          type: string
          format: date-time
          description: When the pool was created
        type:
          $ref: '#/components/schemas/V3PoolTypeEnum'
        query:
          type: object
          description: Filter selecting the accounts a dynamic pool contains
          additionalProperties: true
        poolAccounts:
          type: array
          description: Accounts currently in the pool
          items:
            $ref: '#/components/schemas/V3AccountID'

    V3PoolBalances:
      type: array
      description: Aggregated balances across a pool's accounts
      items:
        $ref: '#/components/schemas/V3PoolBalance'

    V3PoolBalance:
      type: object
      required:
        - asset
        - amount
      properties:
        asset:
          type: string
          description: Asset the balance is denominated in
        amount:
          type: integer
          format: bigint
          description: Total held across the pool for this asset, in the asset's smallest unit
        relatedAccounts:
          nullable: true
          type: array
          description: Accounts contributing to this balance
          items:
            type: string

    V3PoolTypeEnum:
      type: string
      description: Whether a pool holds a fixed account list or is driven by a query
      enum:
        - STATIC
        - DYNAMIC

    # TASKS
    V3GetTaskResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V3Task'

    V3Task:
      type: object
      description: An asynchronous unit of work, tracking an operation that completes in the background
      required:
        - id
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique identifier of the task
        status:
          $ref: '#/components/schemas/V3TaskStatusEnum'
        createdAt:
          type: string
          format: date-time
          description: When the task was created
        updatedAt:
          type: string
          format: date-time
          description: When the task was last updated
        connectorID:
          type: string
          format: byte
          description: Identifier of the connector the task runs against
        createdObjectID:
          type: string
          description: Identifier of the object the task created, once it has succeeded
        error:
          type: string
          nullable: true
          description: Why the task failed, absent when it succeeded

    V3TaskStatusEnum:
      type: string
      description: Where a task stands, from pending through to succeeded or failed
      enum:
        - PROCESSING
        - SUCCEEDED
        - FAILED

    # OTHERS
    V3QueryBuilder:
      type: object
      additionalProperties: true

    V3Metadata:
      type: object
      additionalProperties:
        type: string
      nullable: true
      description: Arbitrary key/value pairs attached to the resource

    V3ErrorResponse:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          $ref: '#/components/schemas/V3ErrorsEnum'
        errorMessage:
          type: string
          description: Human-readable description of the error
          example: '[VALIDATION] missing required config field: pollingPeriod'
        details:
          type: string
          description: Optional link carrying additional context about the error
    V3ErrorsEnum:
      type: string
      description: Machine-readable error code identifying the failure
      enum:
        - INTERNAL
        - VALIDATION
        - INVALID_ID
        - MISSING_OR_INVALID_BODY
        - CONFLICT
        - NOT_FOUND
      example: VALIDATION
