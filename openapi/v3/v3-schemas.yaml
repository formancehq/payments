openapi: 3.0.3
info:
  title: Payments API
  version: v3

components:
  schemas:
    # ACCOUNTS
    V3AccountID:
      type: string

    V3AccountsCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          description: Paginated cursor wrapping the list of accounts
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/V3Account'

    V3GetAccountResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V3Account'

    V3CreateAccountRequest:
      type: object
      required:
        - reference
        - connectorID
        - createdAt
        - accountName
        - type
      properties:
        reference:
          type: string
          description: Identifier the account carries at the provider
        connectorID:
          type: string
          format: byte
          description: Identifier of the connector the account belongs to
        createdAt:
          type: string
          format: date-time
          description: When the account was created at the provider
        accountName:
          type: string
          description: Human-readable name of the account
        type:
          $ref: '#/components/schemas/V3AccountTypeEnum'
        defaultAsset:
          type: string
          pattern: ^[a-zA-Z]{3}\/[0-9]$
          nullable: true
          description: Asset the account is denominated in by default
        metadata:
          $ref: '#/components/schemas/V3Metadata'

    V3CreateAccountResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V3Account'

    V3Account:
      type: object
      description: An account held at a payment provider, surfaced through a connector
      required:
        - id
        - connectorID
        - provider
        - reference
        - createdAt
        - type
        - raw
      properties:
        id:
          type: string
          description: Unique identifier of the account within Formance
        connectorID:
          type: string
          format: byte
          description: Identifier of the connector the account belongs to
        connector:
          $ref: '#/components/schemas/V3ConnectorBase'
        provider:
          type: string
          description: Name of the payment provider behind the connector
        reference:
          type: string
          description: Identifier the account carries at the provider
        createdAt:
          type: string
          format: date-time
          description: When the account was created at the provider
        type:
          $ref: '#/components/schemas/V3AccountTypeEnum'
        name:
          type: string
          nullable: true
          description: Human-readable name of the account
        defaultAsset:
          type: string
          nullable: true
          description: Asset the account is denominated in by default
        metadata:
          $ref: '#/components/schemas/V3Metadata'
        raw:
          type: object
          description: The provider's original payload, passed through untouched
          additionalProperties: true
    V3AccountTypeEnum:
      type: string
      description: Whether an account is internal to the provider or belongs to an external party
      enum:
        - UNKNOWN
        - INTERNAL
        - EXTERNAL

    # BALANCES
    V3BalancesCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          description: Paginated cursor wrapping the list of balances
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/V3Balance'
    V3Balance:
      type: object
      required:
        - accountID
        - createdAt
        - lastUpdatedAt
        - asset
        - balance
      properties:
        accountID:
          type: string
          description: Identifier of the account this balance belongs to
        createdAt:
          type: string
          format: date-time
          description: Start of the period this balance covers
        lastUpdatedAt:
          type: string
          format: date-time
          description: When the balance was last refreshed from the provider
        asset:
          type: string
          description: Asset the balance is denominated in
        balance:
          type: integer
          format: bigint
          description: Amount held, in the asset's smallest unit

    # BANK ACCOUNTS
    V3CreateBankAccountRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Human-readable name for the bank account
        accountNumber:
          type: string
          description: Domestic account number. Supply this or an IBAN
        iban:
          type: string
          description: International bank account number. Supply this or an account number
        swiftBicCode:
          type: string
          description: SWIFT/BIC code identifying the bank
        country:
          type: string
          description: Country the account is held in, as an ISO 3166-1 alpha-2 code
        metadata:
          $ref: '#/components/schemas/V3Metadata'

    V3CreateBankAccountResponse:
      type: object
      required:
        - data
      properties:
        data:
          description: The ID of the created bank account
          type: string

    V3UpdateBankAccountMetadataRequest:
      type: object
      required:
        - metadata
      properties:
        metadata:
          $ref: '#/components/schemas/V3Metadata'

    V3ForwardBankAccountRequest:
      type: object
      required:
        - connectorID
      properties:
        connectorID:
          type: string
          format: byte
          description: Identifier of the connector to forward the bank account to

    V3ForwardBankAccountResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: The task tracking the forwarding, which completes asynchronously
          required:
            - taskID
          properties:
            taskID:
              description: >
                Since this call is asynchronous, the response will contain the ID of the task that was created to forward the bank account to the PSP. You can use the task API to check the status of
                the task and get the resulting bank account ID.
              type: string

    V3BankAccountsCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          description: Paginated cursor wrapping the list of bank accounts
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/V3BankAccount'

    V3GetBankAccountResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V3BankAccount'

    V3BankAccount:
      type: object
      description: A bank account registered with Formance and forwardable to connectors
      required:
        - id
        - createdAt
        - name
      properties:
        id:
          type: string
          description: Unique identifier of the bank account within Formance
        createdAt:
          type: string
          format: date-time
          description: When the bank account was registered
        name:
          type: string
          description: Human-readable name of the bank account
        accountNumber:
          type: string
          nullable: true
          description: Domestic account number, when the account is identified that way
        iban:
          type: string
          nullable: true
          description: International bank account number, when the account is identified that way
        swiftBicCode:
          type: string
          nullable: true
          description: SWIFT/BIC code identifying the bank
        country:
          type: string
          nullable: true
          description: Country the account is held in, as an ISO 3166-1 alpha-2 code
        metadata:
          $ref: '#/components/schemas/V3Metadata'
        relatedAccounts:
          type: array
          description: Provider-side accounts this bank account has been forwarded to
          items:
            $ref: '#/components/schemas/V3BankAccountRelatedAccount'

    V3BankAccountRelatedAccount:
      type: object
      required:
        - accountID
        - createdAt
      properties:
        accountID:
          type: string
          description: Identifier of the provider-side account
        createdAt:
          type: string
          format: date-time
          description: When the bank account was forwarded to this provider

    # CONNECTORS
    V3InstallConnectorRequest:
      $ref: '#/components/schemas/V3ConnectorConfig'

    V3InstallConnectorResponse:
      type: object
      required:
        - data
      properties:
        data:
          description: The ID of the created connector
          type: string

    V3UninstallConnectorResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: The task tracking the uninstall, which completes asynchronously
          required:
            - taskID
          properties:
            taskID:
              description: >
                Since this call is asynchronous, the response will contain the ID of the task that was created to uninstall the connector. You can use the task API to check the status of the task and
                get the results.
              type: string

    V3ResetConnectorResponse:
      type: object
      required:
        - data
      properties:
        data:
          description: >
            Since this call is asynchronous, the response will contain the ID of the task that was created to reset the connector. You can use the task API to check the status of the task and get the
            results.
          type: string

    V3Capability:
      type: string
      description: >
        Plugin capability advertised by a connector. Distinct from the
        Formance gateway "module capabilities" (which are version-gated);
        these reflect what the underlying PSP integration actually exposes.
      enum:
        - FETCH_ACCOUNTS
        - FETCH_BALANCES
        - FETCH_EXTERNAL_ACCOUNTS
        - FETCH_PAYMENTS
        - FETCH_OTHERS
        - FETCH_ORDERS
        - FETCH_CONVERSIONS
        - CREATE_WEBHOOKS
        - TRANSLATE_WEBHOOKS
        - CREATE_BANK_ACCOUNT
        - CREATE_TRANSFER
        - CREATE_PAYOUT
        - ALLOW_FORMANCE_ACCOUNT_CREATION
        - ALLOW_FORMANCE_PAYMENT_CREATION

    V3ConnectorCapabilitiesResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: Map of provider name to the capabilities its plugin advertises.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/V3Capability'

    V3ConnectorCapabilityResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          description: Operations this connector supports
          items:
            $ref: '#/components/schemas/V3Capability'

    V3ConnectorConfigsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: Configuration schema of every available connector, keyed by provider
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              required:
                - dataType
                - required
              properties:
                dataType:
                  type: string
                required:
                  type: boolean
                defaultValue:
                  type: string

    V3GetConnectorConfigResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V3ConnectorConfig'

    V3UpdateConnectorRequest:
      $ref: '#/components/schemas/V3ConnectorConfig'

    V3ConnectorsCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          description: Paginated cursor wrapping the list of connectors
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/V3Connector'

    V3ConnectorSchedulesCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          description: Paginated cursor wrapping the connector's schedules
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/V3Schedule'

    V3ConnectorScheduleResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V3Schedule'

    V3ConnectorScheduleInstancesCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          description: Paginated cursor wrapping the schedule's runs
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/V3Instance'

    V3Connector:
      type: object
      required:
        - id
        - reference
        - name
        - createdAt
        - provider
        - scheduledForDeletion
        - config
      properties:
        id:
          type: string
          description: Unique identifier of the connector
        reference:
          type: string
          description: Stable reference identifying the connector
        name:
          type: string
          description: Human-readable name of the connector instance
        createdAt:
          type: string
          format: date-time
          description: When the connector was installed
        provider:
          type: string
          description: Name of the payment provider behind the connector
        scheduledForDeletion:
          type: boolean
          description: Whether the connector is being uninstalled
        config:
          type: object
          description: The connector's configuration, whose shape depends on the provider
        capabilities:
          type: array
          description: Plugin capabilities advertised by the connector's provider.
          items:
            $ref: '#/components/schemas/V3Capability'
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the connector's configuration was last changed

    V3ConnectorBase:
      type: object
      description: Summary of a connector, without its configuration
      properties:
        id:
          type: string
          description: Unique identifier of the connector
        reference:
          type: string
          description: Stable reference identifying the connector
        name:
          type: string
          description: Human-readable name of the connector instance
        createdAt:
          type: string
          format: date-time
          description: When the connector was installed
        provider:
          type: string
          description: Name of the payment provider behind the connector

    V3Schedule:
      type: object
      description: A recurring job a connector runs to fetch data from its provider
      required:
        - id
        - connectorID
        - createdAt
      properties:
        id:
          type: string
          description: Unique identifier of the schedule
        connectorID:
          type: string
          format: byte
          description: Identifier of the connector this schedule belongs to
        createdAt:
          type: string
          format: date-time
          description: When the schedule was created
        pausedAt:
          type: string
          format: date-time
          nullable: true
          description: When the schedule was paused, absent while it is running
        pausedReason:
          type: string
          nullable: true
          description: Why the schedule was paused

    V3Instance:
      type: object
      required:
        - id
        - connectorID
        - scheduleID
        - createdAt
        - updatedAt
        - terminated
      properties:
        id:
          type: string
          description: Unique identifier of the run
        connectorID:
          type: string
          format: byte
          description: Identifier of the connector this run belongs to
        scheduleID:
          type: string
          description: Identifier of the schedule that started this run
        createdAt:
          type: string
          format: date-time
          description: When the run started
        updatedAt:
          type: string
          format: date-time
          description: When the run was last updated
        terminated:
          type: boolean
          description: Whether the run has finished, successfully or not
        terminatedAt:
          type: string
          format: date-time
          description: When the run finished, absent while it is still running
        error:
          type: string
          nullable: true
          description: Why the run failed, absent when it succeeded

    # PAYMENTS
    V3CreatePaymentRequest:
      type: object
      required:
        - reference
        - connectorID
        - createdAt
        - type
        - initialAmount
        - amount
        - asset
        - scheme
      properties:
        reference:
          type: string
          description: Identifier the payment carries at the provider
        connectorID:
          type: string
          format: byte
          description: Identifier of the connector the payment belongs to
        createdAt:
          type: string
          format: date-time
          description: When the payment was created at the provider
        type:
          $ref: '#/components/schemas/V3PaymentTypeEnum'
        initialAmount:
          type: integer
          format: bigint
          description: Amount the payment was created with, before any adjustment
        amount:
          type: integer
          format: bigint
          description: Current amount of the payment, in the asset's smallest unit
        asset:
          type: string
          pattern: ^[a-zA-Z]{3}\/[0-9]$
          description: Asset the payment is denominated in
        scheme:
          type: string
          description: Payment scheme or rail the payment travels over
        sourceAccountID:
          type: string
          format: byte
          description: Identifier of the account the funds leave
        destinationAccountID:
          type: string
          format: byte
          description: Identifier of the account the funds reach
        metadata:
          $ref: '#/components/schemas/V3Metadata'
        adjustments:
          type: array
          description: Status and amount changes to record alongside the payment
          items:
            $ref: '#/components/schemas/V3CreatePaymentAdjustmentRequest'

    V3CreatePaymentAdjustmentRequest:
      type: object
      required:
        - reference
        - createdAt
        - status
      properties:
        reference:
          type: string
          description: Identifier the adjustment carries at the provider
        createdAt:
          type: string
          format: date-time
          description: When the adjustment occurred at the provider
        status:
          $ref: '#/components/schemas/V3PaymentStatusEnum'
        amount:
          type: integer
          format: bigint
          description: Amount carried by this adjustment
        asset:
          type: string
          pattern: ^[a-zA-Z]{3}\/[0-9]$
          description: Asset the adjustment is denominated in
        metadata:
          $ref: '#/components/schemas/V3Metadata'

    V3CreatePaymentResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V3Payment'

    V3UpdatePaymentMetadataRequest:
      type: object
      required:
        - metadata
      properties:
        metadata:
          $ref: '#/components/schemas/V3Metadata'

    V3PaymentsCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          description: Paginated cursor wrapping the list of payments
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/V3Payment'

    V3GetPaymentResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V3Payment'

    V3Payment:
      type: object
      description: A payment observed at a provider and surfaced through a connector
      required:
        - id
        - connectorID
        - provider
        - reference
        - createdAt
        - type
        - initialAmount
        - amount
        - asset
        - scheme
        - status
      properties:
        id:
          type: string
          description: Unique identifier of the payment within Formance
        connectorID:
          type: string
          format: byte
          description: Identifier of the connector the payment belongs to
        provider:
          type: string
          description: Name of the payment provider behind the connector
        reference:
          type: string
          description: Identifier the payment carries at the provider
        createdAt:
          type: string
          format: date-time
          description: When the payment was created at the provider
        type:
          $ref: '#/components/schemas/V3PaymentTypeEnum'
        initialAmount:
          type: integer
          format: bigint
          description: Amount the payment was created with, before any adjustment
        amount:
          type: integer
          format: bigint
          description: Current amount of the payment after applying its adjustments
        asset:
          type: string
          description: Asset the payment is denominated in
        scheme:
          type: string
          description: Payment scheme or rail the payment travelled over
        status:
          $ref: '#/components/schemas/V3PaymentStatusEnum'
        sourceAccountID:
          type: string
          format: byte
          nullable: true
          description: Identifier of the account the funds left
        destinationAccountID:
          type: string
          format: byte
          nullable: true
          description: Identifier of the account the funds reached
        metadata:
          $ref: '#/components/schemas/V3Metadata'
        adjustments:
          type: array
          nullable: true
          description: Successive changes to the payment's amount and status, newest first
          items:
            $ref: '#/components/schemas/V3PaymentAdjustment'

    V3PaymentAdjustment:
      type: object
      required:
        - id
        - reference
        - createdAt
        - status
        - raw
      properties:
        id:
          type: string
          description: Unique identifier of the adjustment
        reference:
          type: string
          description: Identifier the adjustment carries at the provider
        createdAt:
          type: string
          format: date-time
          description: When the adjustment occurred at the provider
        status:
          $ref: '#/components/schemas/V3PaymentStatusEnum'
        amount:
          type: integer
          format: bigint
          description: Amount carried by this adjustment
        asset:
          type: string
          description: Asset the adjustment is denominated in
        metadata:
          $ref: '#/components/schemas/V3Metadata'
        raw:
          type: object
          description: The provider's original payload for this adjustment
          additionalProperties: true

    V3PaymentTypeEnum:
      type: string
      description: Direction of a payment
      enum:
        - UNKNOWN
        - PAY-IN
        - PAYOUT
        - TRANSFER
        - OTHER

    V3PaymentStatusEnum:
      type: string
      description: Where a payment stands in its lifecycle
      enum:
        - UNKNOWN
        - PENDING
        - SUCCEEDED
        - CANCELLED
        - FAILED
        - EXPIRED
        - REFUNDED
        - REFUNDED_FAILURE
        - REFUND_REVERSED
        - DISPUTE
        - DISPUTE_WON
        - DISPUTE_LOST
        - AMOUNT_ADJUSTEMENT
        - AUTHORISATION
        - CAPTURE
        - CAPTURE_FAILED
        - OTHER

    # ORDERS
    V3OrdersCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          description: Paginated cursor wrapping the list of orders
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/V3Order'

    V3GetOrderResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V3Order'

    V3Order:
      type: object
      description: |
        A trade order submitted to an exchange-style PSP. Orders are read-only
        in the Formance API: they are fetched from the underlying connector.
        Status transitions are captured via the `adjustments` array; each
        adjustment is a point-in-time snapshot from the PSP.
      required:
        - id
        - connectorID
        - provider
        - reference
        - createdAt
        - updatedAt
        - direction
        - sourceAsset
        - destinationAsset
        - type
        - status
        - baseQuantityOrdered
        - timeInForce
      properties:
        id:
          type: string
          description: Formance-assigned unique order ID (composed from the PSP reference and connector ID).
        connectorID:
          type: string
          format: byte
          description: ID of the Formance connector this order was fetched from.
        provider:
          type: string
          description: Provider name of the connector (e.g. `coinbaseprime`).
        reference:
          type: string
          description: PSP-assigned order reference. Unique within the connector; used as the storage dedup key.
        clientOrderID:
          type: string
          nullable: true
          description: |
            Client-assigned ID supplied to the PSP for placement idempotency
            (e.g. Coinbase `client_order_id`, Kraken `cl_ord_id`, Binance
            `clientOrderId`). Stored for traceability only — Formance does
            NOT dedup on this field.
        createdAt:
          type: string
          format: date-time
          description: When the order was created on the PSP.
        updatedAt:
          type: string
          format: date-time
          description: When Formance last observed a state change on the order. Equivalent to the latest adjustment's `createdAt`.
        direction:
          $ref: '#/components/schemas/V3OrderDirectionEnum'
        sourceAsset:
          type: string
          description: |
            Asset being spent, in `SYMBOL/precision` form (e.g. `USD/2`,
            `BTC/8`). For BUY: the quote currency. For SELL: the base
            currency.
        destinationAsset:
          type: string
          description: |
            Asset being received, in `SYMBOL/precision` form.
            For BUY: the base currency. For SELL: the quote currency.
        type:
          $ref: '#/components/schemas/V3OrderTypeEnum'
        status:
          $ref: '#/components/schemas/V3OrderStatusEnum'
        baseQuantityOrdered:
          type: integer
          format: bigint
          description: Amount of base asset the order was placed for, as an integer at the base asset's precision.
        baseQuantityFilled:
          type: integer
          format: bigint
          nullable: true
          description: Amount of base asset filled so far, as an integer at the base asset's precision. Null before any fill.
        limitPrice:
          type: integer
          format: bigint
          nullable: true
          description: Maximum price (for BUY) or minimum price (for SELL) at which the order may execute, in `priceAsset` precision. Required for LIMIT-family order types; null otherwise.
        stopPrice:
          type: integer
          format: bigint
          nullable: true
          description: Trigger price at which a STOP / STOP_LIMIT order activates, in `priceAsset` precision. Null for non-stop order types.
        timeInForce:
          $ref: '#/components/schemas/V3TimeInForceEnum'
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Expiration instant for `GOOD_UNTIL_DATE_TIME` orders. Null for other time-in-force values.
        fee:
          type: integer
          format: bigint
          nullable: true
          description: Commission charged by the PSP for the order, as an integer in `feeAsset` precision.
        feeAsset:
          type: string
          nullable: true
          description: Currency the fee is denominated in, in `SYMBOL/precision` form. Typically the quote asset.
        averageFillPrice:
          type: integer
          format: bigint
          nullable: true
          description: Volume-weighted average price across all fills so far, in `priceAsset` precision. Analytics field — may be absent if the PSP does not report it.
        quoteAmount:
          type: integer
          format: bigint
          nullable: true
          description: |
            Total amount of quote currency exchanged so far, as reported by
            the PSP (e.g. Coinbase `filled_value`), at `quoteAsset`
            precision. For BUY: amount spent. For SELL: amount received.
        quoteAsset:
          type: string
          nullable: true
          description: Quote currency with precision (e.g. `USD/2`). Null when the order has no quote-side amounts reported yet.
        priceAsset:
          type: string
          nullable: true
          description: |
            Currency + precision under which `limitPrice`, `stopPrice`, and
            `averageFillPrice` should be interpreted. Separate from
            `quoteAsset` because some PSPs return price strings with more
            decimal digits than the quote currency's natural precision.
        sourceAccountID:
          type: string
          nullable: true
          description: |
            Formance account ID of the wallet the source asset was debited
            from. Null if the PSP did not return enough information to
            resolve it at ingestion time.
        destinationAccountID:
          type: string
          nullable: true
          description: Formance account ID of the wallet the destination asset was credited to. Null if unresolvable.
        metadata:
          $ref: '#/components/schemas/V3Metadata'
        adjustments:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/V3OrderAdjustment'
          description: Ordered history of state snapshots for this order. The most recent element reflects the current `status`.
        error:
          type: string
          nullable: true
          description: Human-readable error from the PSP (e.g. rejection reason) when `status` is `FAILED`. Null otherwise.

    V3OrderAdjustment:
      type: object
      description: |
        Immutable snapshot of an order's state at a single observation.
        Formance records one adjustment per distinct state the PSP reports
        (status change, fill progress, fee update). Events are emitted
        per-adjustment, not per-order — so a single order can produce many
        events over its lifetime.
      required:
        - id
        - reference
        - createdAt
        - status
      properties:
        id:
          type: string
          description: Adjustment ID, composed from the order ID plus the state fields that define uniqueness (status, filled quantity, fee). Idempotent — replaying the same observation produces the same ID.
        reference:
          type: string
          description: PSP reference the adjustment belongs to (equal to the parent order's `reference`).
        createdAt:
          type: string
          format: date-time
          description: When Formance observed this state. Not the PSP's own timestamp — reflects ingestion time.
        status:
          $ref: '#/components/schemas/V3OrderStatusEnum'
        baseQuantityFilled:
          type: integer
          format: bigint
          nullable: true
          description: Base asset filled at this observation, at the base asset's precision.
        fee:
          type: integer
          format: bigint
          nullable: true
          description: Cumulative fee at this observation, at `feeAsset` precision.
        feeAsset:
          type: string
          nullable: true
          description: Currency the fee is denominated in, in `SYMBOL/precision` form.
        metadata:
          $ref: '#/components/schemas/V3Metadata'
        raw:
          type: object
          additionalProperties: true
          description: Untransformed PSP response payload that produced this adjustment. Retained for debugging and replay.

    V3OrderDirectionEnum:
      type: string
      description: Whether an order buys or sells the base asset.
      enum:
        - UNKNOWN
        - BUY
        - SELL

    V3OrderTypeEnum:
      type: string
      description: |
        Exchange order type. Determines which price fields are meaningful on
        `V3Order`: LIMIT-family types use `limitPrice`; STOP-family types use
        `stopPrice`; TWAP/VWAP are time-weighted execution algorithms.
      enum:
        - UNKNOWN
        - MARKET
        - LIMIT
        - STOP_LIMIT
        - STOP
        - TWAP
        - VWAP
        - PEG
        - BLOCK
        - RFQ
        - TRAILING_STOP
        - TRAILING_STOP_LIMIT
        - TAKE_PROFIT
        - TAKE_PROFIT_LIMIT
        - LIMIT_MAKER

    V3OrderStatusEnum:
      type: string
      description: |
        Lifecycle of an order on the exchange.
        `PENDING` — accepted by the exchange, not yet working.
        `OPEN` — live on the book, no fills yet.
        `PARTIALLY_FILLED` — live on the book, some base quantity filled.
        `FILLED` — fully filled, terminal.
        `CANCELLED` — cancelled by the user or system, terminal.
        `FAILED` — rejected by the exchange, terminal. See `error` for details.
        `EXPIRED` — `timeInForce` elapsed before full fill, terminal.
      enum:
        - UNKNOWN
        - PENDING
        - OPEN
        - PARTIALLY_FILLED
        - FILLED
        - CANCELLED
        - FAILED
        - EXPIRED

    V3TimeInForceEnum:
      type: string
      description: |
        How long an order is valid on the exchange.
        `GOOD_UNTIL_CANCELLED` — rests until explicitly cancelled.
        `GOOD_UNTIL_DATE_TIME` — rests until `expiresAt`.
        `IMMEDIATE_OR_CANCEL` — fill immediately, cancel any unfilled portion.
        `FILL_OR_KILL` — fill fully and immediately, or cancel entirely.
      enum:
        - UNKNOWN
        - GOOD_UNTIL_CANCELLED
        - GOOD_UNTIL_DATE_TIME
        - IMMEDIATE_OR_CANCEL
        - FILL_OR_KILL

    # CONVERSIONS
    V3ConversionsCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          description: Paginated cursor wrapping the list of conversions
          required:
            - pageSize
            - hasMore
            - data
          properties:
            pageSize:
              type: integer
              format: int64
              minimum: 1
              example: 15
            hasMore:
              type: boolean
              example: false
            previous:
              type: string
              example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
            next:
              type: string
              example: ''
            data:
              type: array
              items:
                $ref: '#/components/schemas/V3Conversion'

    V3GetConversionResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/V3Conversion'

    V3Conversion:
      type: object
      description: |
        A currency or asset conversion executed on a PSP (e.g. Coinbase Prime
        transfer between a USD and USDC wallet). Conversions are read-only in
        the Formance API: they are fetched from the underlying connector.
        Unlike orders, conversions do not carry an adjustment history —
        Formance records the final state only.
      required:
        - id
        - connectorID
        - provider
        - reference
        - createdAt
        - updatedAt
        - sourceAsset
        - destinationAsset
        - sourceAmount
        - status
      properties:
        id:
          type: string
          description: Formance-assigned unique conversion ID.
        connectorID:
          type: string
          format: byte
          description: ID of the Formance connector this conversion was fetched from.
        provider:
          type: string
          description: Provider name of the connector (e.g. `coinbaseprime`).
        reference:
          type: string
          description: PSP-assigned conversion reference. Unique within the connector.
        createdAt:
          type: string
          format: date-time
          description: When the conversion was initiated on the PSP.
        updatedAt:
          type: string
          format: date-time
          description: When Formance last observed a state change on the conversion.
        sourceAsset:
          type: string
          description: Asset being converted from, in `SYMBOL/precision` form (e.g. `USD/2`).
        destinationAsset:
          type: string
          description: Asset being converted to, in `SYMBOL/precision` form (e.g. `USDC/6`).
        sourceAmount:
          type: integer
          format: bigint
          description: Amount of source asset debited, as an integer at `sourceAsset` precision.
        destinationAmount:
          type: integer
          format: bigint
          nullable: true
          description: Amount of destination asset credited, at `destinationAsset` precision. Null until the conversion completes.
        fee:
          type: integer
          format: bigint
          nullable: true
          description: PSP fee for the conversion, at `feeAsset` precision.
        feeAsset:
          type: string
          nullable: true
          description: Currency the fee is denominated in, in `SYMBOL/precision` form.
        status:
          $ref: '#/components/schemas/V3ConversionStatusEnum'
        sourceAccountID:
          type: string
          nullable: true
          description: Formance account ID of the wallet the source asset was debited from.
        destinationAccountID:
          type: string
          nullable: true
          description: Formance account ID of the wallet the destination asset was credited to.
        metadata:
          $ref: '#/components/schemas/V3Metadata'
        error:
          type: string
          nullable: true
          description: Human-readable error from the PSP when `status` is `FAILED`. Null otherwise.

    V3ConversionStatusEnum:
      type: string
      description: |
        Lifecycle of a conversion.
        `PENDING` — accepted by the PSP, not yet settled.
        `COMPLETED` — settled, terminal.
        `FAILED` — rejected or reverted, terminal. See `error`.
      enum:
        - UNKNOWN
        - PENDING
        - COMPLETED
        - FAILED

    # PAYMENT INITIATIONS
    V3InitiatePaymentRequest:
      type: object
      required:
        - reference
        - scheduledAt
        - connectorID
        - description
        - type
        - amount
        - asset
      properties:
        reference:
          type: string
          minLength: 3
          maxLength: 1000
          description: Caller-supplied identifier for the initiation, used to deduplicate retries
        scheduledAt:
          type: string
          format: date-time
          description: When the payment should be executed
        connectorID:
          type: string
          format: byte
          description: Identifier of the connector to execute the payment through
        description:
          type: string
          maxLength: 10000
          description: Human-readable description carried with the payment
        type:
          $ref: '#/components/schemas/V3PaymentInitiationTypeEnum'
        amount:
          type: integer
          format: bigint
          description: Amount to move, in the asset's smallest unit
        asset:
          type: string
          pattern: ^[a-zA-Z]{3}\/[0-9]$
          description: Asset the payment is denominated in
        sourceAccountID:
          type: string
          format: byte
          nullable: true
          description: Identifier of the account the funds leave
        destinationAccountID:
          type: string
          format: byte
          description: Identifier of the account the funds reach
        metadata:
          $ref: '#/components/schemas/V3Metadata'

    V3InitiatePaymentResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: The task tracking the initiation, which completes asynchronously
          properties:
            paymentInitiationID:
              description: >
                Related payment initiation object ID created.
              type: string
            taskID:
              description: >
                Will be filled if the noValidation query parameter is set to true. Since this call is asynchronous, the response will contain the ID of the task that was created to create the payment
                on the PSP. You can use the task API to check the status of the task and get the resulting payment ID
              type: string

    V3RetryPaymentInitiationResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: The task tracking the retry, which completes asynchronously
          required:
            - taskID
          properties:
            taskID:
              description: >
                Since this call is asynchronous, the response will contain the ID of the task that was created to retry the payment initiation to the PSP. You can use the task API to check the status
                of the task and get the resulting payment ID.
              type: string

    V3ApprovePaymentInitiationResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: The task tracking the approval, which completes asynchronously
          required:
            - taskID
          properties:
            taskID:
              description: >
                Since this call is asynchronous, the response will contain the ID of the task that was created to approve the payment initiation. You can use the task API to check the status of the
                task and get the resulting payment ID.
              type: string

    V3ReversePaymentInitiationRequest:
      type: object
      required:
        - reference
        - description
        - amount
        - asset
      properties:
        reference:
          type: string
          minLength: 3
          maxLength: 1000
          description: Caller-supplied identifier for the reversal, used to deduplicate retries
        description:
          type: string
          maxLength: 10000
          description: Human-readable reason for the reversal
        amount:
          type: integer
          format: bigint
          description: Amount to reverse, in the asset's smallest unit
        asset:
          type: string
          pattern: ^[a-zA-Z]{3}\/[0-9]$
          description: Asset the reversal is denominated in
        metadata:
          $ref: '#/components/schemas/V3Metadata'

    V3ReversePaymentInitiationResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: The task tracking the reversal, which completes asynchronously
          properties:
            taskID:
              description: >
                Since this call is asynchronous, the response will contain the ID of the task that was created to reverse the payment initiation. You can use the task API to check the status of the
                task and get the resulting payment ID.
              type: string
            paymentInitiationReversalID:
              description: >
                Related payment initiation reversal object ID created.
              type: string

    V3PaymentInitiationsCursorResponse:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: object
          description: Paginated cursor wrapping the list of payment initiations
