    Payment:
      type: object
      description: A payment observed at a provider and surfaced through a connector
      required:
        - id
        - reference
        - connectorID
        - sourceAccountID
        - destinationAccountID
        - type
        - status
        - initialAmount
        - amount
        - scheme
        - asset
        - createdAt
        - raw
        - adjustments
        - metadata
      properties:
        id:
          type: string
          description: Unique identifier of the payment within Formance
          example: XXX
        reference:
          type: string
          description: Identifier the payment carries at the provider
        sourceAccountID:
          type: string
          description: Identifier of the account the funds left
        destinationAccountID:
          type: string
          description: Identifier of the account the funds reached
        connectorID:
          type: string
          description: Identifier of the connector the payment belongs to
        provider:
          $ref: '#/components/schemas/Connector'
        type:
          $ref: '#/components/schemas/PaymentType'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        initialAmount:
          type: integer
          format: bigint
          minimum: 0
          description: Amount the payment was created with, before any adjustment
          example: 100
        amount:
          type: integer
          format: bigint
          minimum: 0
          description: Current amount of the payment after applying its adjustments
          example: 100
        scheme:
          $ref: '#/components/schemas/PaymentScheme'
        asset:
          type: string
          description: Asset the payment is denominated in
          example: USD
        createdAt:
          type: string
          format: date-time
          description: When the payment was created at the provider
        raw:
          type: object
          nullable: true
          description: The provider's original payload, passed through untouched
          additionalProperties: true
        adjustments:
          type: array
          description: Successive changes to the payment's amount and status
          items:
            $ref: '#/components/schemas/PaymentAdjustment'
        metadata:
          $ref: '#/components/schemas/PaymentMetadata'
    PaymentAdjustment:
      type: object
      required:
        - reference
        - createdAt
        - amount
        - status
        - raw
      properties:
        reference:
          type: string
          description: Identifier the adjustment carries at the provider
        createdAt:
          type: string
          format: date-time
          description: When the adjustment occurred at the provider
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: integer
          format: bigint
          minimum: 0
          description: Amount carried by this adjustment
          example: 100
        raw:
          type: object
          description: The provider's original payload for this adjustment
          additionalProperties: true
    PaymentMetadata:
      type: object
