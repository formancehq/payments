        adjustmentID:
          type: string
          description: Unique identifier of the adjustment
        createdAt:
          type: string
          format: date-time
          description: When the adjustment was recorded
        status:
          $ref: '#/components/schemas/TransferInitiationStatus'
        error:
          type: string
          nullable: true
          description: Why this step failed, absent when it succeeded
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Arbitrary key/value pairs attached to the adjustment
    TransferInitiationPayments:
      type: object
      required:
        - paymentID
        - createdAt
        - status
      properties:
        paymentID:
          type: string
          description: Identifier of the payment produced by the initiation
        createdAt:
          type: string
          format: date-time
          description: When the payment was produced
        status:
          $ref: '#/components/schemas/LegacyPaymentStatus'
        error:
          type: string
          nullable: true
          description: Why the payment failed, absent when it succeeded
    BankAccount:
      type: object
      description: A bank account registered with Formance and forwardable to connectors
      required:
        - id
        - name
        - createdAt
        - country
      properties:
        id:
          type: string
          description: Unique identifier of the bank account within Formance
        name:
          type: string
          description: Human-readable name of the bank account
        createdAt:
          type: string
          format: date-time
          description: When the bank account was registered
        country:
          type: string
          description: Country the account is held in, as an ISO 3166-1 alpha-2 code
        connectorID:
          type: string
          description: Identifier of the connector the account has been forwarded to
        accountID:
          type: string
          description: Identifier of the provider-side account created by forwarding
        provider:
          type: string
          description: Name of the payment provider behind the connector
        iban:
          type: string
          description: International bank account number, when the account is identified that way
        accountNumber:
          type: string
          description: Domestic account number, when the account is identified that way
        swiftBicCode:
          type: string
          description: SWIFT/BIC code identifying the bank
        relatedAccounts:
          type: array
          description: Provider-side accounts this bank account has been forwarded to
          items:
            $ref: '#/components/schemas/BankAccountRelatedAccounts'
        metadata:
          $ref: '#/components/schemas/BankAccountMetadata'
    BankAccountRelatedAccounts:
      type: object
      required:
        - id
        - createdAt
        - connectorID
        - provider
        - accountID
      properties:
        id:
          type: string
