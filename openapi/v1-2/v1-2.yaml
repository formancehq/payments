    StripeConfig:
      type: object
      required:
        - name
        - apiKey
      properties:
        name:
          type: string
          description: Human-readable name identifying this connector instance
          example: My Stripe Account
        provider:
          type: string
          default: Stripe
          description: Identifies the payment provider this configuration targets
        pollingPeriod:
          type: string
          example: 120m
          description: >
            The frequency at which the connector will try to fetch new
            BalanceTransaction objects from Stripe API.
          default: 30m
        apiKey:
          type: string
          description: API key issued by Stripe, used to authenticate the connector's requests
          example: XXX
        pageSize:
          type: integer
          format: int64
          minimum: 0
          description: |
            Number of BalanceTransaction to fetch at each polling interval.
          default: 100
          example: 50
    DummyPayConfig:
      type: object
      required:
        - name
        - directory
