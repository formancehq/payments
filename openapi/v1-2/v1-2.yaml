openapi: 3.0.3
info:
  title: Payments API
  version: v1
paths:
  /payments:
    post:
      summary: Create a payment
      tags:
        - payments.v1
      operationId: createPayment
      description: Create a payment
      requestBody:
        $ref: '#/components/requestBodies/Payment'
      responses:
        '200':
          $ref: '#/components/responses/Payment'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
    get:
      summary: List payments
      operationId: listPayments
      tags:
        - payments.v1
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          $ref: '#/components/responses/Payments'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /payments/{paymentId}:
    get:
      summary: Get a payment
      tags:
        - payments.v1
      operationId: getPayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          $ref: '#/components/responses/Payment'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /payments/{paymentId}/metadata:
    patch:
      summary: Update metadata
      tags:
        - payments.v1
      operationId: updateMetadata
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateMetadata'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /transfer-initiations:
    get:
      summary: List Transfer Initiations
      operationId: listTransferInitiations
      tags:
        - payments.v1
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          $ref: '#/components/responses/TransferInitiations'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
    post:
      summary: Create a TransferInitiation
      tags:
        - payments.v1
      operationId: createTransferInitiation
      description: Create a transfer initiation
      requestBody:
        $ref: '#/components/requestBodies/TransferInitiation'
      responses:
        '200':
          $ref: '#/components/responses/TransferInitiation'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /transfer-initiations/{transferId}:
    get:
      summary: Get a transfer initiation
      tags:
        - payments.v1
      operationId: getTransferInitiation
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          $ref: '#/components/responses/TransferInitiation'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
    delete:
      summary: Delete a transfer initiation
      operationId: deleteTransferInitiation
      tags:
        - payments.v1
      description: Delete a transfer initiation by its id.
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /transfer-initiations/{transferId}/status:
    post:
      summary: Update the status of a transfer initiation
      tags:
        - payments.v1
      operationId: updateTransferInitiationStatus
      description: Update a transfer initiation status
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateTransferInitiationStatus'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /transfer-initiations/{transferId}/reverse:
    post:
      summary: Reverse a transfer initiation
      tags:
        - payments.v1
      operationId: reverseTransferInitiation
      description: Reverse transfer initiation
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        $ref: '#/components/requestBodies/ReverseTransferInitiation'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /transfer-initiations/{transferId}/retry:
    post:
      summary: Retry a failed transfer initiation
      tags:
        - payments.v1
      operationId: retryTransferInitiation
      description: Retry a failed transfer initiation
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /pools:
    get:
      summary: List Pools
      operationId: listPools
      tags:
        - payments.v1
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          $ref: '#/components/responses/Pools'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
    post:
      summary: Create a Pool
      tags:
        - payments.v1
      operationId: createPool
      description: Create a Pool
      requestBody:
        $ref: '#/components/requestBodies/Pool'
      responses:
        '200':
          $ref: '#/components/responses/Pool'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /pools/{poolId}:
    get:
      summary: Get a Pool
      tags:
        - payments.v1
      operationId: getPool
      parameters:
        - $ref: '#/components/parameters/PoolId'
      responses:
        '200':
          $ref: '#/components/responses/Pool'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
    delete:
      summary: Delete a Pool
      operationId: deletePool
      tags:
        - payments.v1
      description: Delete a pool by its id.
      parameters:
        - $ref: '#/components/parameters/PoolId'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /pools/{poolId}/query:
    patch:
      summary: Update the query of a pool
      tags:
        - payments.v1
      operationId: updatePoolQuery
      parameters:
        - $ref: '#/components/parameters/PoolId'
      requestBody:
        $ref: '#/components/requestBodies/UpdatePoolQuery'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /pools/{poolId}/accounts:
    post:
      summary: Add an account to a pool
      tags:
        - payments.v1
      operationId: addAccountToPool
      description: Add an account to a pool
      parameters:
        - $ref: '#/components/parameters/PoolId'
      requestBody:
        $ref: '#/components/requestBodies/AddAccountToPool'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /pools/{poolId}/accounts/{accountId}:
    delete:
      summary: Remove an account from a pool
      operationId: removeAccountFromPool
      tags:
        - payments.v1
      description: Remove an account from a pool by its id.
      parameters:
        - $ref: '#/components/parameters/PoolId'
        - $ref: '#/components/parameters/AccountId'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /pools/{poolId}/balances:
    get:
      summary: Get historical pool balances at a particular point in time
      operationId: getPoolBalances
      tags:
        - payments.v1
      parameters:
        - $ref: '#/components/parameters/PoolId'
        - name: at
          in: query
          description: |
            Filter balances by date.
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          $ref: '#/components/responses/PoolBalances'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /pools/{poolId}/balances/latest:
    get:
      summary: Get latest pool balances
      operationId: getPoolBalancesLatest
      tags:
        - payments.v1
      parameters:
        - $ref: '#/components/parameters/PoolId'
      responses:
        '200':
          $ref: '#/components/responses/PoolBalancesLatest'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /accounts:
    post:
      summary: Create an account
      tags:
        - payments.v1
      operationId: createAccount
      description: Create an account
      requestBody:
        $ref: '#/components/requestBodies/Account'
      responses:
        '200':
          $ref: '#/components/responses/Account'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
    get:
      summary: List accounts
      operationId: listAccounts
      tags:
        - payments.v1
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Query'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/Accounts'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /accounts/{accountId}:
    get:
      summary: Get an account
      tags:
        - payments.v1
      operationId: getAccount
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          $ref: '#/components/responses/Account'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /accounts/{accountId}/balances:
    get:
      summary: Get account balances
      operationId: getAccountBalances
      tags:
        - payments.v1
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: limit
          in: query
          description: The maximum number of results to return per page.
          required: false
          schema:
            type: integer
            format: int64
        - name: asset
          in: query
          description: |
            Filter balances by currency.
            If not specified, all account's balances will be returned.
          required: false
          schema:
            type: string
        - name: from
          in: query
          description: |
            Filter balances by date.
            If not specified, all account's balances will be returned.
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: |
            Filter balances by date.
            If not specified, default will be set to now.
          required: false
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/AccountBalances'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /bank-accounts:
    post:
      summary: Create a BankAccount in Payments and on the PSP
      tags:
        - payments.v1
      operationId: createBankAccount
      description: Create a bank account in Payments and on the PSP.
      requestBody:
        $ref: '#/components/requestBodies/BankAccount'
      responses:
        '200':
          $ref: '#/components/responses/BankAccount'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
    get:
      summary: List bank accounts created by user on Formance
      operationId: listBankAccounts
      tags:
        - payments.v1
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      description: List all bank accounts created by user on Formance.
      responses:
        '200':
          $ref: '#/components/responses/BankAccounts'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /bank-accounts/{bankAccountId}:
    get:
      summary: Get a bank account created by user on Formance
      tags:
        - payments.v1
      operationId: getBankAccount
      parameters:
        - $ref: '#/components/parameters/BankAccountId'
      responses:
        '200':
          $ref: '#/components/responses/BankAccount'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /bank-accounts/{bankAccountId}/forward:
    post:
      summary: Forward a bank account to a connector
      tags:
        - payments.v1
      operationId: forwardBankAccount
      parameters:
        - $ref: '#/components/parameters/BankAccountId'
      requestBody:
        $ref: '#/components/requestBodies/ForwardBankAccount'
      responses:
        '200':
          $ref: '#/components/responses/BankAccount'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /bank-accounts/{bankAccountId}/metadata:
    patch:
      summary: Update metadata of a bank account
      tags:
        - payments.v1
      operationId: updateBankAccountMetadata
      parameters:
        - $ref: '#/components/parameters/BankAccountId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateBankAccountMetadata'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /connectors:
    get:
      summary: List all installed connectors
      operationId: listAllConnectors
      tags:
        - payments.v1
      description: List all installed connectors.
      responses:
        '200':
          $ref: '#/components/responses/Connectors'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /connectors/configs:
    get:
      summary: List the configs of each available connector
      operationId: listConfigsAvailableConnectors
      tags:
        - payments.v1
      description: List the configs of each available connector.
      responses:
        '200':
          $ref: '#/components/responses/ConnectorsConfigs'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /connectors/{connector}:
    post:
      summary: Install a connector
      tags:
        - payments.v1
      operationId: installConnector
      description: Install a connector by its name and config.
      parameters:
        - $ref: '#/components/parameters/Connector'
      requestBody:
        $ref: '#/components/requestBodies/ConnectorConfig'
      responses:
        '201':
          $ref: '#/components/responses/ConnectorInstalled'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
    delete:
      summary: Uninstall a connector
      deprecated: true
      operationId: uninstallConnector
      tags:
        - payments.v1
      description: Uninstall a connector by its name.
      parameters:
        - $ref: '#/components/parameters/Connector'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /connectors/{connector}/{connectorId}:
    delete:
      summary: Uninstall a connector
      operationId: uninstallConnectorV1
      tags:
        - payments.v1
      description: Uninstall a connector by its name.
      parameters:
        - $ref: '#/components/parameters/Connector'
        - $ref: '#/components/parameters/ConnectorID'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /connectors/{connector}/config:
    get:
      summary: Read the config of a connector
      deprecated: true
      operationId: readConnectorConfig
      tags:
        - payments.v1
      description: Read connector config
      parameters:
        - $ref: '#/components/parameters/Connector'
      responses:
        '200':
          $ref: '#/components/responses/ConnectorConfig'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /connectors/{connector}/{connectorId}/config:
    post:
      summary: Update the config of a connector
      operationId: updateConnectorConfigV1
      tags:
        - payments.v1
      description: Update connector config
      parameters:
        - $ref: '#/components/parameters/Connector'
        - $ref: '#/components/parameters/ConnectorID'
      requestBody:
        $ref: '#/components/requestBodies/ConnectorConfig'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
    get:
      summary: Read the config of a connector
      operationId: readConnectorConfigV1
      tags:
        - payments.v1
      description: Read connector config
      parameters:
        - $ref: '#/components/parameters/Connector'
        - $ref: '#/components/parameters/ConnectorID'
      responses:
        '200':
          $ref: '#/components/responses/ConnectorConfig'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /connectors/{connector}/reset:
    post:
      summary: Reset a connector
      deprecated: true
      operationId: resetConnector
      tags:
        - payments.v1
      description: |
        Reset a connector by its name.
        It will remove the connector and ALL PAYMENTS generated with it.
      parameters:
        - $ref: '#/components/parameters/Connector'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /connectors/{connector}/{connectorId}/reset:
    post:
      summary: Reset a connector
      operationId: resetConnectorV1
      tags:
        - payments.v1
      description: |
        Reset a connector by its name.
        It will remove the connector and ALL PAYMENTS generated with it.
      parameters:
        - $ref: '#/components/parameters/Connector'
        - $ref: '#/components/parameters/ConnectorID'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
  /connectors/{connector}/tasks:
    get:
      summary: List tasks from a connector
      deprecated: true
      tags:
        - payments.v1
      operationId: listConnectorTasks
      description: List all tasks associated with this connector.
      parameters:
        - $ref: '#/components/parameters/Connector'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/Tasks'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /connectors/{connector}/{connectorId}/tasks:
    get:
      summary: List tasks from a connector
      tags:
        - payments.v1
      operationId: listConnectorTasksV1
      description: List all tasks associated with this connector.
      parameters:
        - $ref: '#/components/parameters/Connector'
        - $ref: '#/components/parameters/ConnectorID'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/Tasks'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /connectors/{connector}/tasks/{taskId}:
    get:
      summary: Read a specific task of the connector
      deprecated: true
      tags:
        - payments.v1
      operationId: getConnectorTask
      description: Get a specific task associated to the connector.
      parameters:
        - $ref: '#/components/parameters/Connector'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          $ref: '#/components/responses/Task'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /connectors/{connector}/{connectorId}/tasks/{taskId}:
    get:
      summary: Read a specific task of the connector
      tags:
        - payments.v1
      operationId: getConnectorTaskV1
      description: Get a specific task associated to the connector.
      parameters:
        - $ref: '#/components/parameters/Connector'
        - $ref: '#/components/parameters/ConnectorID'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          $ref: '#/components/responses/Task'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:read
  /connectors/{connector}/transfers:
    post:
      summary: Transfer funds between Connector accounts
      tags:
        - payments.v1
      operationId: connectorsTransfer
      description: Execute a transfer between two accounts.
      parameters:
        - $ref: '#/components/parameters/Connector'
      requestBody:
        $ref: '#/components/requestBodies/Transfer'
      responses:
        '200':
          $ref: '#/components/responses/Transfer'
        default:
          $ref: '#/components/responses/PaymentsErrorResponse'
      security:
        - Authorization:
            - payments:write
components:
  parameters:
    Query:
      name: query
      in: query
      required: false
      description: |
        Filters used to filter resources.
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      description: |
        The maximum number of results to return per page.
      example: 100
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000
        default: 15
    Cursor:
      name: cursor
      in: query
      description: |
        Parameter used in pagination requests. Maximum page size is set to 15.
        Set to the value of next for the next page of results.
        Set to the value of previous for the previous page of results.
        No other parameters can be set when this parameter is set.
      schema:
        type: string
        example: aHR0cHM6Ly9nLnBhZ2UvTmVrby1SYW1lbj9zaGFyZQ==
    Sort:
      name: sort
      in: query
      schema:
        type: array
        items:
          type: string
      description: Fields used to sort payments (default is date:desc).
      example:
        - date:asc
        - status:desc
    PaymentId:
      name: paymentId
      in: path
      schema:
        type: string
      description: The payment ID.
      example: XXX
      required: true
    AccountId:
      name: accountId
      in: path
      schema:
        type: string
      description: The account ID.
      example: XXX
      required: true
    ConnectorID:
      name: connectorId
      in: path
      schema:
        type: string
      description: The connector ID.
      example: XXX
      required: true
    PoolId:
      name: poolId
      in: path
      schema:
        type: string
      description: The pool ID.
      example: XXX
      required: true
    TransferId:
      name: transferId
      in: path
      schema:
        type: string
      description: The transfer ID.
      example: XXX
      required: true
    BankAccountId:
      name: bankAccountId
      in: path
      schema:
        type: string
      description: The bank account ID.
