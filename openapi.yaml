          type: string
          description: Identifier of the connector to execute the transfer through
        type:
          type: string
          description: Whether the funds move between your accounts or out to a third
            party
          enum:
            - TRANSFER
            - PAYOUT
        amount:
          type: integer
          format: bigint
          description: Amount to move, in the asset's smallest unit
        asset:
          type: string
          description: Asset the transfer is denominated in
          example: USD
        validated:
          type: boolean
          description: When true, the transfer executes immediately instead of waiting
            for approval
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Arbitrary key/value pairs to attach to the initiation
