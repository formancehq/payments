            $ref: '#/components/schemas/PoolBalancesLatestResponse'
    TransferInitiations:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransferInitiationsCursor'
    TransferInitiation:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransferInitiationResponse'
    Accounts:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountsCursor'
    Account:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountResponse'
    AccountBalances:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BalancesCursor'
    ConnectorInstalled:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectorResponse'
    Connectors:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectorsResponse'
    BankAccounts:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BankAccountsCursor'
    BankAccount:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BankAccountResponse'
    ConnectorsConfigs:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectorsConfigsResponse'
    ConnectorConfig:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectorConfigResponse'
    Tasks:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TasksCursor'
    Task:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskResponse'
    Transfer:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransferResponse'
  schemas:
    CursorBase:
      type: object
      required:
        - pageSize
        - hasMore
        - data
      properties:
        pageSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
          description: Number of items requested per page
          example: 15
        hasMore:
          type: boolean
          description: Whether further pages are available
          example: false
        previous:
          type: string
          description: Cursor for the previous page, absent on the first page
          example: YXVsdCBhbmQgYSBtYXhpbXVtIG1heF9yZXN1bHRzLol=
        next:
          type: string
          description: Cursor for the next page, absent on the last page
          example: ""
    PaymentsCursor:
      type: object
      required:
        - cursor
      properties:
        cursor:
          description: Paginated cursor wrapping the list of payments
          allOf:
            - $ref: '#/components/schemas/CursorBase'
            - type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Payment'
    PoolsCursor:
      type: object
      required:
        - cursor
      properties:
        cursor:
          description: Paginated cursor wrapping the list of pools
          allOf:
            - $ref: '#/components/schemas/CursorBase'
            - type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Pool'
    TransferInitiationsCursor:
      type: object
      required:
        - cursor
      properties:
        cursor:
          description: Paginated cursor wrapping the list of transfer initiations
          allOf:
            - $ref: '#/components/schemas/CursorBase'
            - type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/TransferInitiation'
    BankAccountsCursor:
      type: object
      required:
        - cursor
      properties:
        cursor:
          description: Paginated cursor wrapping the list of bank accounts
          allOf:
            - $ref: '#/components/schemas/CursorBase'
            - type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/BankAccount'
    AccountsCursor:
      type: object
      required:
        - cursor
      properties:
        cursor:
          description: Paginated cursor wrapping the list of accounts
          allOf:
            - $ref: '#/components/schemas/CursorBase'
            - type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Account'
    BalancesCursor:
      type: object
      required:
        - cursor
      properties:
        cursor:
          description: Paginated cursor wrapping the list of balances
          allOf:
            - $ref: '#/components/schemas/CursorBase'
            - type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/AccountBalance'
    TasksCursor:
      type: object
      required:
        - cursor
      properties:
        cursor:
          description: Paginated cursor wrapping the list of tasks
          allOf:
            - $ref: '#/components/schemas/CursorBase'
            - type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    oneOf:
                      - $ref: '#/components/schemas/TaskStripe'
                      - $ref: '#/components/schemas/TaskWise'
                      - $ref: '#/components/schemas/TaskCurrencyCloud'
                      - $ref: '#/components/schemas/TaskDummyPay'
                      - $ref: '#/components/schemas/TaskModulr'
                      - $ref: '#/components/schemas/TaskBankingCircle'
                      - $ref: '#/components/schemas/TaskMangoPay'
                      - $ref: '#/components/schemas/TaskMoneycorp'
    ConnectorConfigResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ConnectorConfig'
    PaymentResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Payment'
    PoolBalancesResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PoolBalances'
    PoolBalancesLatestResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PoolBalancesLatest'
    PoolResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Pool'
    TransferInitiationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/TransferInitiation'
    AccountResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Account'
    ConnectorResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: The connector that was installed
          required:
            - connectorID
          properties:
            connectorID:
              type: string
    ConnectorsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          description: The connectors installed on this stack
          items:
            type: object
            required:
              - provider
              - name
              - connectorID
            properties:
              provider:
                $ref: '#/components/schemas/Connector'
              name:
                type: string
              connectorID:
                type: string
              enabled:
                type: boolean
    BankAccountResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/BankAccount'
    ConnectorsConfigsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: Configuration schema of every available connector, keyed by
            provider
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              required:
                - dataType
                - required
              properties:
                dataType:
                  type: string
                required:
                  type: boolean
                defaultValue:
                  type: string
    TaskResponse:
      type: object
      required:
        - data
      properties:
        data:
          description: The requested task
          oneOf:
            - $ref: '#/components/schemas/TaskStripe'
            - $ref: '#/components/schemas/TaskWise'
            - $ref: '#/components/schemas/TaskCurrencyCloud'
            - $ref: '#/components/schemas/TaskDummyPay'
            - $ref: '#/components/schemas/TaskModulr'
            - $ref: '#/components/schemas/TaskBankingCircle'
            - $ref: '#/components/schemas/TaskMangoPay'
            - $ref: '#/components/schemas/TaskMoneycorp'
    TransferResponse:
      type: object
      properties:
        id:
          type: string
          description: Identifier of the transfer created at the provider
    Connector:
      type: string
      description: The payment provider behind a connector
      enum:
        - STRIPE
        - DUMMY-PAY
        - WISE
        - MODULR
        - CURRENCY-CLOUD
        - BANKING-CIRCLE
        - MANGOPAY
        - MONEYCORP
        - ATLAR
        - ADYEN
        - GENERIC
    TransferInitiationStatus:
      type: string
      description: Where a transfer initiation stands in its lifecycle
      enum:
        - WAITING_FOR_VALIDATION
        - PROCESSING
        - PROCESSED
        - FAILED
        - REJECTED
        - VALIDATED
        - ASK_RETRIED
        - ASK_REVERSED
        - REVERSE_PROCESSING
        - REVERSE_FAILED
        - PARTIALLY_REVERSED
        - REVERSED
    ConnectorConfig:
      description: A connector's configuration, whose shape depends on the provider
      discriminator:
        propertyName: provider
        mapping:
          Stripe: '#/components/schemas/StripeConfig'
          Dummypay: '#/components/schemas/DummyPayConfig'
          Wise: '#/components/schemas/WiseConfig'
          Modulr: '#/components/schemas/ModulrConfig'
          Currencycloud: '#/components/schemas/CurrencyCloudConfig'
          Bankingcircle: '#/components/schemas/BankingCircleConfig'
          Mangopay: '#/components/schemas/MangoPayConfig'
          Moneycorp: '#/components/schemas/MoneycorpConfig'
          Atlar: '#/components/schemas/AtlarConfig'
          Adyen: '#/components/schemas/AdyenConfig'
          Generic: '#/components/schemas/GenericConfig'
      oneOf:
        - $ref: '#/components/schemas/StripeConfig'
        - $ref: '#/components/schemas/DummyPayConfig'
        - $ref: '#/components/schemas/WiseConfig'
        - $ref: '#/components/schemas/ModulrConfig'
        - $ref: '#/components/schemas/CurrencyCloudConfig'
        - $ref: '#/components/schemas/BankingCircleConfig'
        - $ref: '#/components/schemas/MangoPayConfig'
        - $ref: '#/components/schemas/MoneycorpConfig'
        - $ref: '#/components/schemas/AtlarConfig'
        - $ref: '#/components/schemas/AdyenConfig'
        - $ref: '#/components/schemas/GenericConfig'
    StripeConfig:
      type: object
      required:
        - name
        - apiKey
      properties:
        name:
          type: string
          description: Human-readable name identifying this connector instance
          example: My Stripe Account
        provider:
          type: string
          default: Stripe
          description: Identifies the payment provider this configuration targets
        pollingPeriod:
          type: string
          example: 120m
          description: |
            The frequency at which the connector will try to fetch new BalanceTransaction objects from Stripe API.
          default: 30m
        apiKey:
          type: string
          description: API key issued by Stripe, used to authenticate the connector's
            requests
          example: XXX
        pageSize:
          type: integer
          format: int64
          minimum: 0
          description: |
            Number of BalanceTransaction to fetch at each polling interval.
          default: 100
          example: 50
    DummyPayConfig:
      type: object
      required:
        - name
        - directory
      properties:
        name:
          type: string
          description: Human-readable name identifying this connector instance
          example: My DummyPay Account
        provider:
          type: string
          default: Dummypay
          description: Identifies the payment provider this configuration targets
        filePollingPeriod:
          type: string
          example: 60s
          description: The frequency at which the connector will try to fetch new payment objects from the directory
          default: 30s
        directory:
          type: string
          description: Filesystem directory the connector reads payment files from
          example: /tmp/dummypay
        prefixFileToIngest:
          type: string
          description: Only ingest files whose name starts with this prefix
        numberOfAccountsPreGenerated:
          type: integer
          format: int64
          description: How many synthetic accounts to create on startup
        numberOfPaymentsPreGenerated:
          type: integer
          format: int64
          description: How many synthetic payments to create on startup
    WiseConfig:
      type: object
      required:
        - name
        - apiKey
      properties:
        name:
          type: string
          description: Human-readable name identifying this connector instance
          example: My Wise Account
        provider:
          type: string
          default: Wise
          description: Identifies the payment provider this configuration targets
        apiKey:
          type: string
          description: API key issued by Wise, used to authenticate the connector's
            requests
          example: XXX
        pollingPeriod:
          type: string
          example: 120m
          description: |
            The frequency at which the connector will try to fetch new BalanceTransaction objects from Wise API.
          default: 30m
    ModulrConfig:
      type: object
      required:
        - name
        - apiKey
        - apiSecret
      properties:
        name:
          type: string
          description: Human-readable name identifying this connector instance
          example: My Modulr Account
        provider:
          type: string
          default: Modulr
          description: Identifies the payment provider this configuration targets
        apiKey:
          type: string
          description: API key issued by Modulr, used to authenticate the connector's
            requests
          example: XXX
        apiSecret:
          type: string
          description: API secret issued by Modulr, paired with the API key to sign
            requests
          example: XXX
        endpoint:
          type: string
          description: Base URL of the Modulr API the connector calls
          example: XXX
        pollingPeriod:
          type: string
          example: 120m
          description: |
            The frequency at which the connector will try to fetch new BalanceTransaction objects from Modulr API.
          default: 30m
    BankingCircleConfig:
      type: object
      required:
        - name
        - username
        - password
        - endpoint
        - authorizationEndpoint
        - userCertificate
        - userCertificateKey
      properties:
        name:
          type: string
          description: Human-readable name identifying this connector instance
          example: My Banking Circle Account
        provider:
          type: string
          default: Bankingcircle
          description: Identifies the payment provider this configuration targets
        username:
          type: string
          description: Username issued by Banking Circle, used to authenticate the
            connector
          example: XXX
        password:
          type: string
          description: Password issued by Banking Circle, used to authenticate the
            connector
          example: XXX
        endpoint:
          type: string
          description: Base URL of the Banking Circle API the connector calls
          example: XXX
        authorizationEndpoint:
          type: string
          description: URL the connector calls to obtain an access token
          example: XXX
        userCertificate:
          type: string
          description: Client certificate presented on the mutual-TLS connection to
            Banking Circle
          example: XXX
        userCertificateKey:
          type: string
          description: Private key matching the client certificate
          example: XXX
        pollingPeriod:
          type: string
          example: 120m
          description: |
            The frequency at which the connector will try to fetch new BalanceTransaction objects from Banking Circle API.
          default: 30m
    GenericConfig:
      type: object
      required:
        - name
        - apiKey
        - endpoint
      properties:
        name:
          type: string
          description: Human-readable name identifying this connector instance
          example: My Generic Account
        provider:
          type: string
          default: Generic
          description: Identifies the payment provider this configuration targets
        apiKey:
          type: string
          description: API key used to authenticate the connector's requests
          example: XXX
        endpoint:
          type: string
          description: Base URL of the API the connector calls
          example: XXX
        pollingPeriod:
          type: string
          example: 120m
          description: |
            The frequency at which the connector will try to fetch new BalanceTransaction objects from the API.
          default: 30m
    MangoPayConfig:
      type: object
      required:
        - name
        - clientID
        - apiKey
        - endpoint
      properties:
        name:
          type: string
          description: Human-readable name identifying this connector instance
          example: My MangoPay Account
        provider:
          type: string
          default: Mangopay
          description: Identifies the payment provider this configuration targets
        pollingPeriod:
          type: string
          example: 120m
          description: |
            The frequency at which the connector will try to fetch new BalanceTransaction objects from MangoPay API.
          default: 30m
        clientID:
          type: string
          description: Client ID issued by MangoPay
          example: XXX
        apiKey:
          type: string
          description: API key issued by MangoPay, used to authenticate the connector's
            requests
          example: XXX
        endpoint:
          type: string
          description: Base URL of the MangoPay API the connector calls
          example: XXX
    MoneycorpConfig:
      type: object
      required:
        - name
        - clientID
        - apiKey
        - endpoint
      properties:
        name:
          type: string
          description: Human-readable name identifying this connector instance
          example: My Moneycorp Account
        provider:
          type: string
          default: Moneycorp
          description: Identifies the payment provider this configuration targets
        clientID:
          type: string
          description: Client ID issued by Moneycorp
          example: XXX
        apiKey:
          type: string
          description: API key issued by Moneycorp, used to authenticate the connector's
            requests
          example: XXX
        endpoint:
          type: string
          description: Base URL of the Moneycorp API the connector calls
          example: XXX
        pollingPeriod:
          type: string
          example: 120m
          description: |
            The frequency at which the connector will try to fetch new BalanceTransaction objects from MoneyCorp API.
          default: 30m
    CurrencyCloudConfig:
      type: object
      required:
        - name
        - apiKey
        - loginID
      properties:
        name:
          type: string
          description: Human-readable name identifying this connector instance
          example: My CurrencyCloud Account
        provider:
          type: string
          default: Currencycloud
          description: Identifies the payment provider this configuration targets
        apiKey:
          type: string
          description: API key issued by Currencycloud, used to authenticate the connector's
            requests
          example: XXX
        loginID:
          type: string
          example: XXX
          description: Username of the API Key holder
        pollingPeriod:
          type: string
          example: 60s
          description: The frequency at which the connector will fetch transactions
          default: 30m
        endpoint:
          type: string
          example: XXX
          description: The endpoint to use for the API. Defaults to https://devapi.currencycloud.com
    AdyenConfig:
      type: object
      required:
        - name
        - apiKey
        - hmacKey
      properties:
        name:
          type: string
          description: Human-readable name identifying this connector instance
          example: My Adyen Account
        provider:
          type: string
          default: Adyen
          description: Identifies the payment provider this configuration targets
        apiKey:
          type: string
          description: API key issued by Adyen, used to authenticate the connector's
            requests
          example: XXX
        hmacKey:
          type: string
          description: HMAC key used to verify the signature on webhooks sent by Adyen
          example: XXX
        liveEndpointPrefix:
          type: string
          description: Prefix of your live Adyen endpoint. Required when the connector
            runs against production
          example: XXX
        pollingPeriod:
          type: string
          example: 60s
          description: |
            The frequency at which the connector will try to fetch new BalanceTransaction objects from Adyen API.
          default: 30m
    AtlarConfig:
      type: object
      required:
        - name
        - accessKey
        - secret
      properties:
        name:
          type: string
          description: Human-readable name identifying this connector instance
          example: My Atlar Account
        provider:
          type: string
          default: Atlar
          description: Identifies the payment provider this configuration targets
        baseUrl:
          type: string
          example: https://api.example.com
          default: https://api.atlar.com
          description: |
            The base URL the client uses for making requests towards the Atlar API.
        pollingPeriod:
          type: string
          example: 120m
          description: |
            The frequency at which the connector tries to fetch new Transaction objects from the Atlar API.
          default: 30m
        transferInitiationStatusPollingPeriod:
          deprecated: true
          type: string
          example: 60s
          description: |
            The frequency at which the connector tries to fetch the status of payment initiations from the Atlar API.
          default: 120s
        accessKey:
          type: string
          example: XXX
          description: |
            The access key used by the connector for authorizing requests to the Atlar API.
            You can obtain it along with the associated secret from the Atlar dashboard.
        secret:
          type: string
          example: XXX
          description: |
            The secret used by the connector for authorizing requests to the Atlar API.
            You can obtain it along with the associated access key from the Atlar dashboard.
        pageSize:
          type: integer
          format: int64
          minimum: 10
          description: |
            Number of items to fetch when querying paginated APIs.
          default: 25
          example: 50
    TransferInitiation:
      type: object
      description: A transfer Formance asked a connector to execute
      required:
        - id
        - reference
        - createdAt
        - scheduledAt
        - description
        - sourceAccountID
        - destinationAccountID
        - connectorID
        - provider
        - type
        - amount
        - initialAmount
        - asset
        - status
      properties:
        id:
          type: string
          description: Unique identifier of the transfer initiation
          example: XXX
        reference:
          type: string
          description: Caller-supplied identifier for the initiation
        createdAt:
          type: string
          format: date-time
          description: When the initiation was created
        scheduledAt:
          type: string
          format: date-time
          description: When the transfer is scheduled to execute
        description:
          type: string
          description: Human-readable description carried with the transfer
        sourceAccountID:
          type: string
          description: Identifier of the account the funds leave
        destinationAccountID:
          type: string
          description: Identifier of the account the funds reach
        connectorID:
          type: string
          description: Identifier of the connector executing the transfer
        provider:
          type: string
          nullable: true
          description: Name of the payment provider behind the connector
        type:
          type: string
          description: Whether the funds move between your accounts or out to a third
            party
          enum:
            - TRANSFER
            - PAYOUT
        amount:
          type: integer
          format: bigint
          description: Amount to move, in the asset's smallest unit
        initialAmount:
          type: integer
          format: bigint
          description: Amount the initiation was created with, before any adjustment
        asset:
          type: string
          description: Asset the transfer is denominated in
          example: USD
        status:
          $ref: '#/components/schemas/TransferInitiationStatus'
        error:
          type: string
          nullable: true
          description: Why the initiation failed, absent when it succeeded
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Arbitrary key/value pairs attached to the initiation
        relatedPayments:
          type: array
          nullable: true
          description: Payments produced by this initiation
          items:
            $ref: '#/components/schemas/TransferInitiationPayments'
        relatedAdjustments:
          type: array
          description: Successive status changes recorded against the initiation
          items:
            $ref: '#/components/schemas/TransferInitiationAdjustments'
    TransferInitiationAdjustments:
      type: object
      required:
        - adjustmentID
        - createdAt
        - status
      properties:
        adjustmentID:
          type: string
          description: Unique identifier of the adjustment
        createdAt:
          type: string
          format: date-time
          description: When the adjustment was recorded
        status:
          $ref: '#/components/schemas/TransferInitiationStatus'
        error:
          type: string
          nullable: true
          description: Why this step failed, absent when it succeeded
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Arbitrary key/value pairs attached to the adjustment
    TransferInitiationPayments:
      type: object
      required:
        - paymentID
        - createdAt
        - status
      properties:
        paymentID:
          type: string
          description: Identifier of the payment produced by the initiation
        createdAt:
          type: string
          format: date-time
          description: When the payment was produced
        status:
          $ref: '#/components/schemas/LegacyPaymentStatus'
        error:
          type: string
          nullable: true
          description: Why the payment failed, absent when it succeeded
    BankAccount:
      type: object
      description: A bank account registered with Formance and forwardable to connectors
      required:
        - id
        - name
        - createdAt
        - country
      properties:
        id:
          type: string
          description: Unique identifier of the bank account within Formance
        name:
          type: string
          description: Human-readable name of the bank account
        createdAt:
          type: string
          format: date-time
          description: When the bank account was registered
        country:
          type: string
          description: Country the account is held in, as an ISO 3166-1 alpha-2 code
        connectorID:
          type: string
          description: Identifier of the connector the account has been forwarded
            to
        accountID:
          type: string
          description: Identifier of the provider-side account created by forwarding
        provider:
          type: string
          description: Name of the payment provider behind the connector
        iban:
          type: string
          description: International bank account number, when the account is identified
            that way
        accountNumber:
          type: string
          description: Domestic account number, when the account is identified that
            way
        swiftBicCode:
          type: string
          description: SWIFT/BIC code identifying the bank
        relatedAccounts:
          type: array
          description: Provider-side accounts this bank account has been forwarded
            to
          items:
            $ref: '#/components/schemas/BankAccountRelatedAccounts'
        metadata:
