    TransferInitiationRequest:
      type: object
      required:
        - reference
        - scheduledAt
        - description
        - sourceAccountID
        - destinationAccountID
        - type
        - amount
        - asset
        - validated
      properties:
        reference:
          type: string
          description: Caller-supplied identifier for the initiation, used to deduplicate
            retries
          example: XXX
        scheduledAt:
          type: string
          format: date-time
          description: When the transfer should be executed
        description:
          type: string
          description: Human-readable description carried with the transfer
        sourceAccountID:
          type: string
          description: Identifier of the account the funds leave
        destinationAccountID:
          type: string
          description: Identifier of the account the funds reach
