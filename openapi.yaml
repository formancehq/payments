  /v3/connectors/capabilities:
    get:
      tags:
        - payments.v3
      summary: List the plugin capabilities advertised by every supported provider
      description: |
        Returns the static map of provider name to the list of plugin capabilities (`FETCH_ACCOUNTS`, `CREATE_TRANSFER`, ...) compiled into this binary. The catalog is immutable for the lifetime of the process and is therefore safe to cache: the response carries a strong ETag and a `Cache-Control: public, max-age=3600, must-revalidate` directive. Stateless consumers (e.g. console) should set `If-None-Match` on subsequent requests to receive a `304 Not Modified`.
      operationId: v3ListConnectorCapabilities
      x-speakeasy-name-override: ListConnectorCapabilities
      parameters:
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
          description: ETag from a previous response; a matching value yields 304 Not Modified.
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
              description: Opaque, strong validator for the catalog body.
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V3ConnectorCapabilitiesResponse'
        "304":
          description: Not Modified
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V3ErrorResponse'
      security:
        - Authorization:
            - payments:read
